name: GearGuide live prices

# Refreshes hardware-advisor/live-prices.json from Best Buy's official Products API every day,
# so GearGuide shows today's Best Buy prices. Needs a repository secret named BESTBUY_API_KEY
# (a free key from https://developer.bestbuy.com). Without the secret this workflow skips itself.
on:
  schedule:
    - cron: '17 9 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Fetch today's prices
        env:
          BESTBUY_API_KEY: ${{ secrets.BESTBUY_API_KEY }}
        working-directory: hardware-advisor
        run: |
          if [ -z "$BESTBUY_API_KEY" ]; then echo "No BESTBUY_API_KEY secret yet; skipping."; exit 0; fi
          node research/update-live-prices.mjs
      - name: Save the new prices
        run: |
          git config user.name "gearguide-prices"
          git config user.email "gearguide-prices@users.noreply.github.com"
          git add hardware-advisor/live-prices.json
          git diff --cached --quiet || (git commit -m "GearGuide: refresh live prices" && git push)
