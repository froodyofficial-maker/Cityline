name: GearGuide live prices

# Refreshes hardware-advisor/live-prices.json every day from shops with an official price service:
#  - Best Buy (US): repository secret BESTBUY_API_KEY (free key from https://developer.bestbuy.com)
#  - Flipkart (India): secrets FLIPKART_AFFILIATE_ID and FLIPKART_AFFILIATE_TOKEN (free affiliate account
#    at https://affiliate.flipkart.com)
# Each shop runs only when its secrets are set; with none set, this workflow skips itself.
on:
  schedule:
    - cron: '17 9 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Fetch today's prices
        env:
          BESTBUY_API_KEY: ${{ secrets.BESTBUY_API_KEY }}
          FLIPKART_AFFILIATE_ID: ${{ secrets.FLIPKART_AFFILIATE_ID }}
          FLIPKART_AFFILIATE_TOKEN: ${{ secrets.FLIPKART_AFFILIATE_TOKEN }}
        working-directory: hardware-advisor
        run: |
          if [ -z "$BESTBUY_API_KEY" ] && [ -z "$FLIPKART_AFFILIATE_TOKEN" ]; then echo "No shop secrets yet; skipping."; exit 0; fi
          node research/update-live-prices.mjs
      - name: Save the new prices
        run: |
          git config user.name "gearguide-prices"
          git config user.email "gearguide-prices@users.noreply.github.com"
          git add hardware-advisor/live-prices.json
          git diff --cached --quiet || (git commit -m "GearGuide: refresh live prices" && git push)
