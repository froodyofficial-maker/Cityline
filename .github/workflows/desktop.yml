name: Desktop app

# Builds the Ember City desktop app on GitHub's Windows runners.
# Every run uploads the .exe as a downloadable artifact and publishes it as a GitHub Release
# (Actions -> Desktop app -> Run workflow; the release tag defaults to v2.3.0). Pushing a v* tag does the same.
on:
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag
        default: v2.3.0
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Build the single-file game
        run: |
          npm ci
          npm run build
      - name: Package the Windows app
        working-directory: desktop
        run: |
          npm ci
          npm run dist:win
      - uses: actions/upload-artifact@v4
        with:
          name: EmberCity-windows
          path: |
            desktop/release/*.exe
            desktop/release/*.zip
      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.tag || github.ref_name }}
          name: Ember City ${{ github.event.inputs.tag || github.ref_name }}
          target_commitish: ${{ github.sha }}
          body: |
            Windows: download **EmberCity-*-portable.exe** and double-click it (no install needed). F11 toggles fullscreen.
            The zip contains the same app unpacked.
          files: |
            desktop/release/*.exe
            desktop/release/*.zip
