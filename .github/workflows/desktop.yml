name: Desktop app

# Builds the Ember City desktop app on GitHub's Windows runners.
# Every run uploads the .exe as a downloadable artifact; pushing a tag like v2.1.0 also publishes a Release.
on:
  workflow_dispatch:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Build the single-file game
        run: |
          npm ci
          npm run build
      - name: Package the Windows app
        working-directory: desktop
        run: |
          npm ci
          npm run dist:win
      - uses: actions/upload-artifact@v4
        with:
          name: EmberCity-windows
          path: |
            desktop/release/*.exe
            desktop/release/*.zip
      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            desktop/release/*.exe
            desktop/release/*.zip
