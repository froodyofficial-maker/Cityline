<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
</head>
<body>
<title>Hype Cut</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;700&family=JetBrains+Mono:wght@400;600&family=Unbounded:wght@600;800;900&display=swap">
<style>
/* Layout: an edit bay. FX library on the left, the monitor in the middle, inspector on the right, timeline across the bottom. */
:root {
  --bg: #0f0d14;
  --panel: #18151f;
  --raise: #231f2c;
  --line: #322c3e;
  --fg: #f1ecf7;
  --muted: #978fa8;
  --accent: #ff3b5c;
  --accent-ink: #1a0509;
  --beat: #3ee0ff;
  --c-motion: #ff7a45;
  --c-light: #ffd447;
  --c-glitch: #3ee0ff;
  --c-color: #b48cff;
  --c-overlay: #7dffa8;
  --display: "Unbounded", "Arial Black", Impact, sans-serif;
  --ui: "Archivo", "Segoe UI", system-ui, sans-serif;
  --mono: "JetBrains Mono", ui-monospace, Menlo, Consolas, monospace;
  --r: 10px;
  color-scheme: dark;
}
[hidden] { display: none !important; }
*, *::before, *::after { box-sizing: border-box; }
html, body { height: 100%; margin: 0; }
body {
  background: var(--bg);
  color: var(--fg);
  font: 14px/1.4 var(--ui);
  display: grid;
  grid-template-rows: auto minmax(0, 1fr) auto;
  gap: 10px;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 0 12px;
  overflow: hidden;
}
button, select, input, textarea { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--beat); outline-offset: 2px; }

/* top bar */
.top { display: flex; align-items: center; gap: 12px; padding-block: 10px; flex-wrap: wrap; }
.brand { font-family: var(--display); font-weight: 900; font-size: 20px; letter-spacing: -.02em; display: flex; align-items: center; gap: 2px; user-select: none; }
.brand b { background: var(--accent); color: var(--accent-ink); padding: 1px 7px 2px; transform: skew(-12deg); display: inline-block; font-weight: 900; }
.brand small { font: 500 11px var(--mono); color: var(--muted); margin-left: 10px; letter-spacing: .04em; }
.top .grow { flex: 1; }
.btn {
  display: inline-flex; align-items: center; gap: 6px; height: 34px; padding: 0 12px;
  border-radius: 8px; border: 1px solid var(--line); background: var(--raise); color: var(--fg);
  cursor: pointer; font-weight: 600; font-size: 13px; white-space: nowrap; user-select: none;
}
.btn:hover { border-color: var(--muted); }
.btn.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); font-weight: 700; }
.btn.primary:hover { filter: brightness(1.08); }
.btn.ghost { background: transparent; }
.btn.sm { height: 28px; padding: 0 9px; font-size: 12px; }
.btn.danger { color: var(--accent); }
.btn[aria-pressed="true"] { border-color: var(--beat); color: var(--beat); }
.btn svg { width: 16px; height: 16px; fill: currentColor; flex: none; }
select.btn { padding-right: 8px; }

/* main grid */
.work { display: grid; grid-template-columns: 236px minmax(0, 1fr) 290px; gap: 10px; min-height: 0; }
.panel { background: var(--panel); border: 1px solid var(--line); border-radius: var(--r); min-height: 0; overflow: auto; }
.panel h2 { font: 800 11px var(--display); letter-spacing: .12em; text-transform: uppercase; color: var(--muted); margin: 0; }

/* library */
.lib { padding: 12px; display: flex; flex-direction: column; gap: 14px; }
.lib p { margin: 0; color: var(--muted); font-size: 12px; }
.fxgroup { display: flex; flex-direction: column; gap: 6px; }
.fxgroup h3 { margin: 0; font: 600 11px var(--mono); letter-spacing: .06em; text-transform: uppercase; display: flex; align-items: center; gap: 6px; }
.fxgroup h3 i { width: 8px; height: 8px; border-radius: 2px; background: var(--cat); }
.fxgrid { display: grid; grid-template-columns: 1fr 1fr; gap: 5px; }
.fxb {
  position: relative; text-align: left; padding: 7px 8px; border-radius: 7px; cursor: pointer;
  background: var(--raise); border: 1px solid transparent; font-size: 12px; font-weight: 600; line-height: 1.15;
  display: flex; align-items: center; justify-content: space-between; gap: 4px; min-height: 32px;
}
.fxb:hover { border-color: var(--cat); }
.fxb:active { transform: scale(.97); }
.fxb kbd { font: 600 10px var(--mono); color: var(--muted); border: 1px solid var(--line); border-radius: 4px; padding: 0 4px; }
.fxb.hit { animation: hit .35s ease-out; }
@keyframes hit { from { background: var(--cat); color: var(--bg); } }

/* stage */
.stagecol { display: flex; flex-direction: column; gap: 8px; min-height: 0; min-width: 0; }
.stage { position: relative; flex: 1; min-height: 0; display: grid; place-items: center; background: #07060a; border-radius: var(--r); border: 1px solid var(--line); overflow: hidden; }
#view { display: block; background: #000; box-shadow: 0 0 0 1px #ffffff14; }
.stage .hint { position: absolute; inset: 12px; border: 2px dashed var(--beat); border-radius: 12px; display: grid; place-items: center; font: 800 16px var(--display); color: var(--beat); background: #07060ad9; pointer-events: none; }
.transport { display: flex; align-items: center; gap: 6px; flex-wrap: wrap; }
.tc { font: 600 15px var(--mono); font-variant-numeric: tabular-nums; padding: 0 10px; min-width: 150px; }
.tc span { color: var(--muted); }
.playbtn { width: 44px; height: 44px; border-radius: 50%; padding: 0; justify-content: center; background: var(--fg); color: var(--bg); border: 0; }
.playbtn svg { width: 20px; height: 20px; }

/* inspector */
.insp { padding: 14px; display: flex; flex-direction: column; gap: 14px; }
.insp .head { display: flex; align-items: center; gap: 8px; justify-content: space-between; }
.insp .title { font: 800 15px var(--display); letter-spacing: -.01em; overflow-wrap: anywhere; }
.chip { font: 600 10px var(--mono); text-transform: uppercase; letter-spacing: .06em; padding: 2px 6px; border-radius: 4px; background: var(--cat, var(--line)); color: var(--bg); white-space: nowrap; }
.sect { display: flex; flex-direction: column; gap: 8px; padding-top: 12px; border-top: 1px solid var(--line); }
.sect h4 { margin: 0; font: 600 11px var(--mono); letter-spacing: .06em; text-transform: uppercase; color: var(--muted); }
.ctl { display: flex; flex-direction: column; gap: 3px; }
.ctl label { display: flex; justify-content: space-between; font-size: 12px; color: var(--muted); }
.ctl output { font: 600 12px var(--mono); color: var(--fg); font-variant-numeric: tabular-nums; }
input[type=range] { width: 100%; accent-color: var(--accent); margin: 0; height: 22px; }
.row { display: flex; gap: 6px; flex-wrap: wrap; align-items: center; }
.row > .grow { flex: 1; min-width: 0; }
.field { height: 30px; border-radius: 7px; border: 1px solid var(--line); background: var(--bg); padding: 0 8px; min-width: 0; }
textarea.field { height: auto; padding: 6px 8px; resize: vertical; font: 800 14px var(--display); }
.seg { display: inline-flex; border: 1px solid var(--line); border-radius: 7px; overflow: hidden; }
.seg button { border: 0; background: transparent; padding: 5px 10px; cursor: pointer; font-size: 12px; font-weight: 600; }
.seg button[aria-pressed="true"] { background: var(--fg); color: var(--bg); }
.stats { display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; }
.stats div { background: var(--raise); border-radius: 7px; padding: 6px 8px; }
.stats b { display: block; font: 600 15px var(--mono); font-variant-numeric: tabular-nums; }
.stats span { font-size: 11px; color: var(--muted); }
.note { font-size: 12px; color: var(--muted); margin: 0; }
.keys { font-size: 12px; color: var(--muted); display: grid; grid-template-columns: auto 1fr; gap: 3px 10px; margin: 0; }
.keys dt { font: 600 11px var(--mono); color: var(--fg); }
.keys dd { margin: 0; }

/* timeline */
.tlwrap { background: var(--panel); border: 1px solid var(--line); border-radius: var(--r); display: flex; flex-direction: column; min-width: 0; }
.tlbar { display: flex; align-items: center; gap: 8px; padding: 6px 10px; border-bottom: 1px solid var(--line); flex-wrap: wrap; }
.tlbar .lbl { font-size: 12px; color: var(--muted); }
.tlbar input[type=range] { width: 120px; }
.tlscroll { height: 196px; overflow-y: auto; overflow-x: hidden; }
#tl { display: block; width: 100%; touch-action: none; cursor: default; }

/* modal + toast */
.modal { position: fixed; inset: 0; background: #07060acc; display: grid; place-items: center; z-index: 20; padding: 16px; }
.card { background: var(--panel); border: 1px solid var(--line); border-radius: 14px; padding: 20px; width: min(440px, 100%); display: flex; flex-direction: column; gap: 14px; max-height: 100%; overflow: auto; }
.card h3 { margin: 0; font: 800 18px var(--display); }
.bar { height: 8px; border-radius: 4px; background: var(--raise); overflow: hidden; }
.bar i { display: block; height: 100%; width: 0; background: var(--accent); }
.card video { width: 100%; max-height: 50vh; background: #000; border-radius: 8px; }
.toast { position: fixed; left: 50%; bottom: calc(24px + env(safe-area-inset-bottom, 0px)); transform: translateX(-50%); background: var(--fg); color: var(--bg); font-weight: 600; padding: 8px 14px; border-radius: 8px; z-index: 30; max-width: calc(100% - 32px); pointer-events: none; transition: opacity .2s; }
.media-pool { position: fixed; width: 1px; height: 1px; overflow: hidden; opacity: 0; pointer-events: none; left: 0; top: 0; }

@media (max-width: 1100px) {
  .work { grid-template-columns: 210px minmax(0, 1fr) 250px; }
}
@media (max-width: 860px) {
  html, body { height: auto; }
  body { overflow: auto; grid-template-rows: auto; }
  .work { grid-template-columns: minmax(0, 1fr); }
  .stagecol { order: 1; }
  .lib { order: 2; }
  .insp { order: 3; }
  .stage { height: 58vh; flex: none; }
  .fxgrid { grid-template-columns: repeat(auto-fill, minmax(118px, 1fr)); }
  .panel { overflow: visible; }
  .brand small { display: none; }
}
@media (prefers-reduced-motion: reduce) {
  .fxb.hit { animation: none; }
  .toast { transition: none; }
}
</style>

<header class="top">
  <div class="brand" aria-label="Hype Cut">HYPE<b>CUT</b><small>edit studio</small></div>
  <div class="grow"></div>
  <label class="btn" for="fileClips" title="Add videos or photos"><svg viewBox="0 0 24 24"><path d="M11 5h2v6h6v2h-6v6h-2v-6H5v-2h6z"/></svg>Clips</label>
  <input type="file" id="fileClips" accept="video/*,image/*" multiple hidden>
  <label class="btn" for="fileMusic" title="Add a song"><svg viewBox="0 0 24 24"><path d="M9 18a3 3 0 1 1-2-2.83V5l12-2v12a3 3 0 1 1-2-2.83V6.3L9 7.7z"/></svg>Music</label>
  <input type="file" id="fileMusic" accept="audio/*,video/*" hidden>
  <select class="btn" id="aspect" title="Frame shape">
    <option value="9:16">9:16 Reels / TikTok</option>
    <option value="4:5">4:5 Feed</option>
    <option value="1:1">1:1 Square</option>
    <option value="16:9">16:9 YouTube</option>
  </select>
  <button class="btn primary" id="exportBtn" type="button"><svg viewBox="0 0 24 24"><path d="M11 3h2v10l3.5-3.5 1.4 1.4L12 16.8l-5.9-5.9 1.4-1.4L11 13zM5 19h14v2H5z"/></svg>Export</button>
</header>

<main class="work">
  <aside class="panel lib" id="lib" aria-label="Effects"></aside>
  <section class="stagecol">
    <div class="stage" id="stage">
      <canvas id="view" width="720" height="1280"></canvas>
      <div class="hint" id="dropHint" hidden>Drop videos, photos or a song</div>
    </div>
    <div class="transport">
      <button class="btn ghost sm" id="prevCut" title="Previous cut (←)" type="button"><svg viewBox="0 0 24 24"><path d="M6 5h2v14H6zm3 7 9-7v14z"/></svg></button>
      <button class="btn playbtn" id="playBtn" title="Play / pause (Space)" type="button"><svg viewBox="0 0 24 24" id="playIcon"><path d="M7 4v16l13-8z"/></svg></button>
      <button class="btn ghost sm" id="nextCut" title="Next cut (→)" type="button"><svg viewBox="0 0 24 24"><path d="M16 5h2v14h-2zM6 5l9 7-9 7z"/></svg></button>
      <div class="tc" id="tc">00:00.00 <span>/ 00:00.00</span></div>
      <div class="grow" style="flex:1"></div>
      <button class="btn sm" id="tapBeat" title="Mark a beat at the playhead (B)" type="button">Tap beat <kbd style="font:10px var(--mono);opacity:.7">B</kbd></button>
      <button class="btn sm" id="loopBtn" aria-pressed="true" title="Loop playback" type="button">Loop</button>
      <button class="btn ghost sm" id="undoBtn" title="Undo (Ctrl+Z)" type="button"><svg viewBox="0 0 24 24"><path d="M12.5 8c-2.65 0-5.05 1-6.9 2.6L2 7v9h9l-3.62-3.62A7.95 7.95 0 0 1 20.1 16l2.36-.78A10.5 10.5 0 0 0 12.5 8z"/></svg></button>
      <button class="btn ghost sm" id="redoBtn" title="Redo (Ctrl+Shift+Z)" type="button"><svg viewBox="0 0 24 24"><path d="M11.5 8c2.65 0 5.05 1 6.9 2.6L22 7v9h-9l3.62-3.62A7.95 7.95 0 0 0 3.9 16l-2.36-.78A10.5 10.5 0 0 1 11.5 8z"/></svg></button>
    </div>
  </section>
  <aside class="panel insp" id="insp" aria-label="Inspector"></aside>
</main>

<section class="tlwrap" aria-label="Timeline">
  <div class="tlbar">
    <span class="lbl">Zoom</span><input type="range" id="zoom" min="20" max="400" value="90" aria-label="Timeline zoom">
    <button class="btn sm" id="snapBtn" aria-pressed="true" type="button" title="Snap effects to beats and cuts">Snap</button>
    <button class="btn sm" id="autoPrevBtn" aria-pressed="true" type="button" title="Play each effect right after you add it">Auto-preview</button>
    <span class="lbl" style="flex:1;text-align:right">Drag effects to move, drag edges to resize. Drag clips to reorder, edges to trim.</span>
  </div>
  <div class="tlscroll"><canvas id="tl" height="180"></canvas></div>
</section>

<div class="modal" id="exportModal" hidden>
  <div class="card" role="dialog" aria-modal="true" aria-labelledby="exTitle">
    <h3 id="exTitle">Export</h3>
    <div id="exSetup" class="sect" style="border:0;padding:0">
      <div class="row"><span class="note grow">Resolution</span><span class="seg" id="exRes"><button type="button" data-v="720">720p</button><button type="button" data-v="1080" aria-pressed="true">1080p</button></span></div>
      <div class="row"><span class="note grow">Frame rate</span><span class="seg" id="exFps"><button type="button" data-v="30" aria-pressed="true">30</button><button type="button" data-v="60">60</button></span></div>
      <p class="note" id="exInfo"></p>
      <div class="row"><button class="btn primary grow" id="exStart" type="button" style="justify-content:center">Render video</button><button class="btn" id="exClose" type="button">Close</button></div>
    </div>
    <div id="exRun" class="sect" style="border:0;padding:0" hidden>
      <p class="note">Rendering in real time. Keep this tab in front until it finishes.</p>
      <div class="bar"><i id="exBar"></i></div>
      <div class="row"><span class="note grow" id="exPct">0%</span><button class="btn sm" id="exCancel" type="button">Cancel</button></div>
    </div>
    <div id="exDone" class="sect" style="border:0;padding:0" hidden>
      <video id="exVideo" controls playsinline></video>
      <p class="note" id="exDoneInfo"></p>
      <div class="row"><button class="btn primary grow" id="exSave" type="button" style="justify-content:center">Save video</button><button class="btn" id="exBack" type="button">Done</button></div>
    </div>
  </div>
</div>
<div class="toast" id="toast" style="opacity:0"></div>
<div class="media-pool" id="pool"></div>

<script>
'use strict';
/* ============================================================ helpers */
const $ = s => document.querySelector(s);
const clamp = (v, a, b) => Math.min(b, Math.max(a, v));
const lerp = (a, b, t) => a + (b - a) * t;
const easeOut = p => 1 - Math.pow(1 - p, 3);
const easeIn = p => p * p * p;
const easeIO = p => p < .5 ? 4 * p * p * p : 1 - Math.pow(-2 * p + 2, 3) / 2;
const hash = n => { const x = Math.sin(n * 127.1 + 311.7) * 43758.5453; return x - Math.floor(x); };
let uidN = 1; const nid = () => uidN++;
const fmtT = t => { t = Math.max(0, t); const m = Math.floor(t / 60), s = Math.floor(t % 60), f = Math.floor((t % 1) * 100); return String(m).padStart(2, '0') + ':' + String(s).padStart(2, '0') + '.' + String(f).padStart(2, '0'); };
const fmtS = t => t.toFixed(2) + 's';
const esc = s => String(s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
let toastTimer;
function toast(msg) { const t = $('#toast'); t.textContent = msg; t.style.opacity = 1; clearTimeout(toastTimer); toastTimer = setTimeout(() => t.style.opacity = 0, 2200); }

/* ============================================================ effects */
const CATS = {
  motion: { name: 'Motion', color: 'var(--c-motion)', hex: '#ff7a45' },
  light: { name: 'Light', color: 'var(--c-light)', hex: '#ffd447' },
  glitch: { name: 'Glitch', color: 'var(--c-glitch)', hex: '#3ee0ff' },
  color: { name: 'Color grade (CC)', color: 'var(--c-color)', hex: '#b48cff' },
  overlay: { name: 'Overlay', color: 'var(--c-overlay)', hex: '#7dffa8' },
};
// fade in/out envelope for effects that hold over a stretch of time
const hold = (ev, p, f = .12) => clamp(Math.min(ev.t <= .001 ? 1 : p * ev.dur / f, ev.t + ev.dur >= S.dur - .001 ? 1 : (1 - p) * ev.dur / f), 0, 1);
function whip(o, p, k, dx, dy) {
  const d = .9;
  const off = p < .5 ? easeIn(p * 2) * d : -(1 - easeOut(p * 2 - 1)) * d;
  o.tx += dx * off; o.ty += dy * off;
  const b = Math.sin(Math.PI * p) * .38 * k;
  o.bx += dx * b; o.by += dy * b;
  o.scale *= 1 + .12 * Math.sin(Math.PI * p) * k;
}
function grade(d) {
  return function (o, p, k, T, ev) {
    const w = k * hold(ev, p, .15);
    o.exposure += (d.exposure || 0) * w; o.contrast += (d.contrast || 0) * w; o.sat += (d.sat || 0) * w;
    o.temp += (d.temp || 0) * w; o.tint += (d.tint || 0) * w; o.hue += (d.hue || 0) * w;
    o.fade += (d.fade || 0) * w; o.mono += (d.mono || 0) * w; o.vignette += (d.vignette || 0) * w;
    if (d.shadow) for (let i = 0; i < 3; i++) o.shadow[i] += d.shadow[i] * w;
    if (d.high) for (let i = 0; i < 3; i++) o.high[i] += d.high[i] * w;
  };
}
const FX = {
  shake: { name: 'Hard Shake', cat: 'motion', dur: .4, key: '1', apply(o, p, k, T, ev) {
    const a = k * Math.pow(1 - p, 1.6), st = Math.floor(T * 32), s = ev.id * 13.1;
    const dx = (hash(st + s) - .5) * .16 * a, dy = (hash(st + s + 5.3) - .5) * .16 * a;
    o.tx += dx; o.ty += dy; o.rot += (hash(st + s + 9.1) - .5) * .1 * a; o.scale *= 1 + .1 * a;
    o.bx += dx * .7; o.by += dy * .7;
  } },
  rumble: { name: 'Rumble', cat: 'motion', dur: .9, apply(o, p, k, T) {
    const a = k * Math.sin(Math.PI * p) * .035;
    o.tx += Math.sin(T * 31) * a + Math.sin(T * 53) * a * .5; o.ty += Math.cos(T * 27) * a; o.rot += Math.sin(T * 19) * a * .6; o.scale *= 1 + a * 1.4;
  } },
  punch: { name: 'Zoom Punch', cat: 'motion', dur: .35, key: '2', apply(o, p, k) {
    const e = p < .18 ? easeOut(p / .18) : 1 - easeIO((p - .18) / .82);
    o.scale *= 1 + .42 * k * e; o.zblur += .1 * k * e * (p < .18 ? 1 : 1 - (p - .18) / .82);
  } },
  pull: { name: 'Zoom Out', cat: 'motion', dur: .45, apply(o, p, k) {
    const e = 1 - easeOut(p); o.scale *= 1 + .7 * k * e; o.zblur += .14 * k * e * e;
  } },
  whipL: { name: 'Whip Left', cat: 'motion', dur: .3, centered: true, key: '3', apply(o, p, k) { whip(o, p, k, -1, 0); } },
  whipR: { name: 'Whip Right', cat: 'motion', dur: .3, centered: true, apply(o, p, k) { whip(o, p, k, 1, 0); } },
  whipU: { name: 'Whip Up', cat: 'motion', dur: .3, centered: true, apply(o, p, k) { whip(o, p, k, 0, 1); } },
  spin: { name: 'Spin 360', cat: 'motion', dur: .55, centered: true, key: '7', apply(o, p, k) {
    const s = Math.sin(Math.PI * p);
    o.rot += easeIO(p) * Math.PI * 2; o.rblur += s * 1.1 * k; o.scale *= 1 + .35 * s * k; o.zblur += .04 * s * k;
  } },
  bounce: { name: 'Beat Bounce', cat: 'motion', dur: .25, key: '9', apply(o, p, k) { o.scale *= 1 + .13 * k * Math.pow(1 - p, 2.5); } },

  flash: { name: 'White Flash', cat: 'light', dur: .25, key: '4', apply(o, p, k) { o.flash += k * Math.pow(1 - p, 2); } },
  dip: { name: 'Black Dip', cat: 'light', dur: .3, centered: true, apply(o, p, k) { o.dark += k * Math.pow(1 - Math.abs(2 * p - 1), .6); } },
  strobe: { name: 'Strobe', cat: 'light', dur: .5, key: '8', apply(o, p, k, T, ev) {
    const st = Math.floor(p * ev.dur * 16); if (st % 2 === 0) o.flash += .85 * k; else o.dark += .35 * k;
  } },
  invert: { name: 'Invert Hit', cat: 'light', dur: .15, apply(o, p, k) { if (p < .65) o.invert += k; } },

}
function snapT(t, exclude) {
  if (!S.snap) return t;
  const th = 8 / TL.pps; let best = t, bd = th;
  const cand = [0, S.dur, S.t, ...S.beats, ...cuts()];
  for (const c of cand) { const d = Math.abs(c - t); if (d < bd) { bd = d; best = c; } }
  return best;
}
function hitTest(x, y) {
  const L = TL._L || tlLayout(), t = tt(x);

  if (y >= L.yV && y < L.yV + TL.VID) {
    for (const c of S.clips) { const x1 = tx(c.start), x2 = tx(c.start + clipDur(c)); if (x >= x1 && x <= x2) { const edge = Math.min(8, (x2 - x1) / 4); return { zone: 'clip', clip: c, part: x - x1 < edge ? 'L' : x2 - x < edge ? 'R' : 'body' }; } }
    return { zone: 'empty' };
  }

    const lane = Math.floor((y - L.yF) / TL.LANE);
    for (let i = S.fx.length - 1; i >= 0; i--) { const ev = S.fx[i]; if (ev._lane !== lane) continue; const x1 = tx(ev.t), x2 = tx(ev.t + ev.dur); if (x >= x1 - 2 && x <= Math.max(x2, x1 + 3) + 2) { const edge = Math.min(7, (x2 - x1) / 3); return { zone: 'fx', ev, part: x - x1 < edge ? 'L' : x2 - x < edge ? 'R' : 'body' }; } }
    return { zone: 'empty' };
  }

}
tl.addEventListener('pointerdown', e => {
  const r = tl.getBoundingClientRect(), x = e.clientX - r.left, y = e.clientY - r.top, h = hitTest(x, y);
  tl.setPointerCapture(e.pointerId);
  drag = { x0: x, y0: y, moved: false, dx: 0, startX0: TL.x0, hit: h };
  if (h.zone === 'ruler') { drag.mode = 'scrub'; seek(tt(x)); }
  else if (h.zone === 'clip') {
    S.sel = { kind: 'clip', id: h.clip.id }; renderInspector();
    drag.clip = h.clip; drag.orig = { in: h.clip.in, out: h.clip.out };
    drag.mode = h.part === 'L' ? 'trimL' : h.part === 'R' ? 'trimR' : 'moveClip'; drag.snap = snapshot();
  } else if (h.zone === 'fx') {
    S.sel = { kind: 'fx', id: h.ev.id }; renderInspector();
    drag.ev = h.ev; drag.orig = { t: h.ev.t, dur: h.ev.dur };
    drag.mode = h.part === 'L' ? 'fxL' : h.part === 'R' ? 'fxR' : 'fxMove'; drag.snap = snapshot();
  } else if (h.zone === 'music') { S.sel = S.music ? { kind: 'music' } : null; renderInspector(); drag.mode = 'pan'; }
  else { drag.mode = 'pan'; }
  dirty = true;
});
tl.addEventListener('pointermove', e => {
  const r = tl.getBoundingClientRect(), x = e.clientX - r.left, y = e.clientY - r.top;
  if (!drag) { const h = hitTest(x, y); tl.style.cursor = (h.part === 'L' || h.part === 'R') ? 'ew-resize' : (h.zone === 'clip' || h.zone === 'fx') ? 'grab' : h.zone === 'ruler' ? 'col-resize' : 'default'; return; }
  const dx = x - drag.x0; if (Math.abs(dx) > 3 || Math.abs(y - drag.y0) > 3) drag.moved = true;
  const dT = dx / TL.pps;
  switch (drag.mode) {
    case 'scrub': seek(tt(x)); break;
    case 'pan': if (drag.moved) TL.x0 = Math.max(0, drag.startX0 - dT); break;
    case 'trimR': { const c = drag.clip, max = c.kind === 'image' ? 1e4 : c.srcDur; c.out = clamp(drag.orig.out + dT * c.speed, c.in + .05, max); const end = snapT(c.start + clipDur(c)); c.out = clamp(c.in + (end - c.start) * c.speed, c.in + .05, max); layout(); break; }
    case 'trimL': { const c = drag.clip; c.in = clamp(drag.orig.in + dT * c.speed, 0, c.out - .05); layout(); break; }
    case 'moveClip': {

      drag.dropIdx = pos; drag.dropT = pos === 0 ? (others[0]?.start ?? 0) : others[pos - 1].start + clipDur(others[pos - 1]);
      break;
    }
    case 'fxMove': { const ev = drag.ev, d = FX[ev.type]; let t = drag.orig.t + dT; if (d.centered) t = snapT(t + ev.dur / 2) - ev.dur / 2; else t = snapT(t); ev.t = Math.max(0, t); break; }
    case 'fxR': { const ev = drag.ev; const end = snapT(drag.orig.t + drag.orig.dur + dT); ev.dur = Math.max(.05, end - ev.t); break; }
    case 'fxL': { const ev = drag.ev, end = drag.orig.t + drag.orig.dur; const t = clamp(snapT(drag.orig.t + dT), 0, end - .05); ev.t = t; ev.dur = end - t; break; }

});
function endDrag(e) {

  const d = drag; drag = null;
  if (d.mode === 'pan' && !d.moved) { const r = tl.getBoundingClientRect(); seek(tt(e.clientX - r.left)); if (d.hit.zone === 'empty') { S.sel = null; renderInspector(); } }
  if (d.mode === 'moveClip' && d.moved) {
    const c = d.clip, i = S.clips.indexOf(c);
    if (d.dropIdx !== undefined && d.dropIdx !== i) { pushFromSnap(d.snap); S.clips.splice(i, 1); S.clips.splice(d.dropIdx, 0, c); layout(); }
  } else if (d.snap && d.moved) pushFromSnap(d.snap);
  if (d.snap) renderInspector();
  dirty = true;
}
function pushFromSnap(s) { if (undoStack[undoStack.length - 1] !== s) { undoStack.push(s); redoStack.length = 0; } }
tl.addEventListener('pointerup', endDrag); tl.addEventListener('pointercancel', endDrag);
tl.addEventListener('wheel', e => {
  e.preventDefault();
  const r = tl.getBoundingClientRect(), x = e.clientX - r.left;
  if (e.ctrlKey || e.metaKey) { const at = tt(x); TL.pps = clamp(TL.pps * Math.exp(-e.deltaY * .002), 20, 400); TL.x0 = Math.max(0, at - (x - TL.PAD) / TL.pps); $('#zoom').value = TL.pps; }
  else TL.x0 = Math.max(0, TL.x0 + (Math.abs(e.deltaX) > Math.abs(e.deltaY) ? e.deltaX : e.deltaY) / TL.pps);
  dirty = true;
}, { passive: false });
$('#zoom').addEventListener('input', e => { const mid = S.t; TL.pps = +e.target.value; TL.x0 = Math.max(0, mid - (tl.clientWidth / 2) / TL.pps); dirty = true; });

/* ============================================================ export */
const EX = { active: false, res: 1080, fps: 30, rec: null, chunks: [], blob: null, url: null, ext: 'webm', cancelled: false };
function pickMime() {
  const list = [['video/mp4;codecs=avc1.640028,mp4a.40.2', 'mp4'], ['video/mp4;codecs=avc1,mp4a.40.2', 'mp4'], ['video/mp4', 'mp4'], ['video/webm;codecs=vp9,opus', 'webm'], ['video/webm;codecs=vp8,opus', 'webm'], ['video/webm', 'webm']];
  if (!window.MediaRecorder) return null;
  for (const [m, e] of list) if (MediaRecorder.isTypeSupported(m)) return { mime: m, ext: e };
  return { mime: '', ext: 'webm' };
}
function openExport() {
  if (!S.clips.length) return toast('Add a clip first');
  pause();
  const mm = pickMime();
  $('#exInfo').textContent = mm ? `${fmtS(S.dur)} edit, saved as ${mm.ext.toUpperCase()}. Export plays the edit once in real time, so it takes about ${Math.ceil(S.dur)} seconds.` : 'This browser cannot record video. Try Chrome, Edge, Firefox or Safari 14.1+.';
  $('#exStart').disabled = !mm;
  $('#exSetup').hidden = false; $('#exRun').hidden = true; $('#exDone').hidden = true;
  $('#exportModal').hidden = false;
}
function segBind(id, key) { $(id).addEventListener('click', e => { const b = e.target.closest('button'); if (!b) return; EX[key] = +b.dataset.v; for (const x of $(id).children) x.setAttribute('aria-pressed', x === b); }); }
segBind('#exRes', 'res'); segBind('#exFps', 'fps');
async function startExport() {
  const mm = pickMime(); if (!mm) return;
  ensureAudio();
  const [w, h] = outSize(EX.res); setCanvasSize(w, h);
  pause(); seek(0);
  // let the first frame decode before the recorder starts
  for (const c of S.clips) if (c.kind === 'video') { c.el.currentTime = c.in; }
  await new Promise(r => setTimeout(r, 350)); render();
  const stream = view.captureStream(EX.fps);
  if (recDest) for (const t of recDest.stream.getAudioTracks()) stream.addTrack(t);
  EX.chunks = []; EX.ext = mm.ext; EX.cancelled = false;
  try { EX.rec = new MediaRecorder(stream, { mimeType: mm.mime || undefined, videoBitsPerSecond: EX.res >= 1080 ? 14e6 : 8e6, audioBitsPerSecond: 192000 }); }
  catch (e) { EX.rec = new MediaRecorder(stream); EX.ext = (EX.rec.mimeType || '').includes('mp4') ? 'mp4' : 'webm'; }
  EX.rec.ondataavailable = e => { if (e.data.size) EX.chunks.push(e.data); };
  EX.rec.onstop = () => {
    stream.getVideoTracks().forEach(t => t.stop());
    EX.active = false; restorePreviewSize();
    if (EX.cancelled) { $('#exportModal').hidden = true; toast('Export cancelled'); return; }
    EX.blob = new Blob(EX.chunks, { type: EX.rec.mimeType || 'video/' + EX.ext });
    if (EX.url) URL.revokeObjectURL(EX.url);
    EX.url = URL.createObjectURL(EX.blob);
    $('#exVideo').src = EX.url;
    $('#exDoneInfo').textContent = `${w}×${h}, ${EX.fps} fps, ${(EX.blob.size / 1048576).toFixed(1)} MB ${EX.ext.toUpperCase()}.`;
    $('#exRun').hidden = true; $('#exDone').hidden = false;
  };
  $('#exSetup').hidden = true; $('#exRun').hidden = false;
  EX.active = true;
  EX.rec.start(250);
  play();
}
function finishExport() { pause(); setTimeout(() => { if (EX.rec && EX.rec.state !== 'inactive') EX.rec.stop(); }, 120); }
function restorePreviewSize() { const [w, h] = outSize(720); setCanvasSize(w, h); }
async function saveExport() {
  if (!EX.blob) return;
  const name = `hypecut-${new Date().toISOString().slice(0, 19).replace(/[:T]/g, '-')}.${EX.ext}`;
  let dl = null; try { dl = window.claude?.use ? await window.claude.use('downloads') : null; } catch (e) { }
  if (dl) {
    try { await dl.save({ filename: name, data: EX.blob }); toast('Saved'); }
    catch (e) { if (e?.code !== 'declined') toast(e?.code === 'too_large' ? 'The video is too large to save here. Try 720p.' : 'Saving is not available here.'); }
    return;
  }
  const a = document.createElement('a'); a.href = EX.url; a.download = name; document.body.appendChild(a); a.click(); a.remove();

$('#exportBtn').addEventListener('click', openExport);
$('#exStart').addEventListener('click', startExport);
$('#exClose').addEventListener('click', () => $('#exportModal').hidden = true);
$('#exBack').addEventListener('click', () => { $('#exportModal').hidden = true; $('#exVideo').pause(); });
$('#exCancel').addEventListener('click', () => { EX.cancelled = true; pause(); if (EX.rec && EX.rec.state !== 'inactive') EX.rec.stop(); else { EX.active = false; restorePreviewSize(); $('#exportModal').hidden = true; } });
$('#exSave').addEventListener('click', saveExport);

/* ============================================================ wiring */
function fitStage() {
  const st = $('#stage'), bw = st.clientWidth - 16, bh = st.clientHeight - 16; if (bw <= 0 || bh <= 0) return;
  const a = view.width / view.height; let w = bw, h = bw / a; if (h > bh) { h = bh; w = bh * a; }
  view.style.width = Math.floor(w) + 'px'; view.style.height = Math.floor(h) + 'px';
}
new ResizeObserver(() => { fitStage(); dirty = true; }).observe($('#stage'));
new ResizeObserver(() => dirty = true).observe(tl.parentElement);
$('#aspect').addEventListener('change', e => { S.aspect = e.target.value; restorePreviewSize(); });
$('#fileClips').addEventListener('change', e => { importFiles(e.target.files); e.target.value = ''; });
$('#fileMusic').addEventListener('change', e => { importFiles(e.target.files, true); e.target.value = ''; });
$('#playBtn').addEventListener('click', toggle);
const jumpCut = dir => { const pts = [0, ...cuts(), S.dur]; const t = dir > 0 ? pts.find(p => p > S.t + .01) : [...pts].reverse().find(p => p < S.t - .01); if (t !== undefined) seek(t); };
$('#prevCut').addEventListener('click', () => jumpCut(-1)); $('#nextCut').addEventListener('click', () => jumpCut(1));
$('#tapBeat').addEventListener('click', tapBeat);
const togBtn = (id, key) => $(id).addEventListener('click', () => { S[key] = !S[key]; $(id).setAttribute('aria-pressed', S[key]); });
togBtn('#loopBtn', 'loop'); togBtn('#snapBtn', 'snap'); togBtn('#autoPrevBtn', 'autoPreview');
$('#undoBtn').addEventListener('click', undo); $('#redoBtn').addEventListener('click', redo);
let dragDepth = 0;
document.addEventListener('dragenter', e => { if ([...(e.dataTransfer?.types || [])].includes('Files')) { dragDepth++; $('#dropHint').hidden = false; } });
document.addEventListener('dragleave', () => { dragDepth = Math.max(0, dragDepth - 1); if (!dragDepth) $('#dropHint').hidden = true; });
document.addEventListener('dragover', e => e.preventDefault());
document.addEventListener('drop', e => { e.preventDefault(); dragDepth = 0; $('#dropHint').hidden = true; if (e.dataTransfer?.files?.length) importFiles(e.dataTransfer.files); });
document.addEventListener('keydown', e => {
  if (e.target.closest('input, textarea, select') || EX.active || !$('#exportModal').hidden) return;
  const k = e.key;
  if ((e.ctrlKey || e.metaKey) && k.toLowerCase() === 'z') { e.preventDefault(); e.shiftKey ? redo() : undo(); return; }
  if ((e.ctrlKey || e.metaKey) && k.toLowerCase() === 'y') { e.preventDefault(); redo(); return; }
  if (e.ctrlKey || e.metaKey || e.altKey) return;
  if (k === ' ') { e.preventDefault(); toggle(); }
  else if (KEYMAP[k]) addFx(KEYMAP[k]);
  else if (k === 'b' || k === 'B') tapBeat();
  else if (k === 's' || k === 'S') splitAt();
  else if (k === 'Delete' || k === 'Backspace') { e.preventDefault(); deleteSel(); }
  else if (k === 'ArrowLeft') { e.preventDefault(); jumpCut(-1); }
  else if (k === 'ArrowRight') { e.preventDefault(); jumpCut(1); }
  else if (k === ',') seek(S.t - 1 / 30);
  else if (k === '.') seek(S.t + 1 / 30);
  else if (k === 'Escape') { S.sel = null; renderInspector(); dirty = true; }

/* ============================================================ boot */
buildLibrary();
let glOk = false;
try { glOk = initGL(); } catch (e) { console.error(e); }
if (!glOk) { $('#stage').insertAdjacentHTML('beforeend', '<div class="hint" style="border-color:var(--accent);color:var(--fg)">This browser has WebGL 2 turned off, so the preview cannot draw. Try a current Chrome, Edge, Firefox or Safari.</div>'); }
restorePreviewSize();
renderInspector();
requestAnimationFrame(frame);
(document.fonts?.load ? document.fonts.load('900 40px Unbounded') : Promise.resolve()).catch(() => { }).finally(() => { dirty = true; });
loadDemo();
</script>
